# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Open Redirect (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask app that redirects to whatever URL the newurl parameter holds (open redirect). The SKF lab folder python/Url-redirection is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-url-redirection

networks:
  lab: { cidr: 10.60.151.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: /redirect sends the browser to its newurl parameter
    script: checks/redirect.sh

message: |
  OWASP SKF Open Redirect answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The button posts to /redirect?newurl=/newsite.
